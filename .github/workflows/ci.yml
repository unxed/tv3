name: ci

# tv3 on Linux x86_64: the library compiles (every unit), the unit tests (tests/t_*.pas) pass, the programs run in a pty (tests/pty).
# The same commands work on a developer machine: tools/test.sh, tools/pty-test.sh (the tests in a pty side by side, as tools/ci-par.sh runs them here).
on:
  workflow_dispatch: {}
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and Python
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl fp-units-base fp-units-misc python3
      - name: The text of the repository (UTF-8, English, glyphs by name)
        run: python3 tools/text-policy.py
      - name: Paths are spelled only by TvPath (a ratchet; tools/paths-baseline.txt)
        run: python3 tools/check-paths.py
      - name: The library builds (every unit that is not for another system)
        run: |
          mkdir -p out/lib
          for f in src/*.pas; do
            case "$f" in src/tvtermoswin.pas) continue ;; esac     # needs the units of Windows
            fpc -Mobjfpc -Fusrc -Fisrc -FUout/lib -FEout/lib -Un "$f" | grep -E 'Error|Fatal' && exit 1
          done
          exit 0
      - name: Unit tests
        run: tools/test.sh
      - name: The programs of the tests in a pty
        run: TV_PTY_WORK=out/pty tools/pty-test.sh --build
      # the tests in a pty wait for the program, not for the CPU: they run side by side, each with a HOME of its own
      - name: Tests in a pty (the demo, the terminal view, the switcher, the clipboard, the far2l extensions)
        env:
          CMDS: |
            python3 tests/pty/test_tvdemo.py out/pty/tvdemo
            python3 tests/pty/test_switcher.py out/pty/tvdemo
            python3 tests/pty/test_held.py out/pty/tvdemo
            python3 tests/pty/test_win32input.py out/pty/tvdemo
            python3 tests/pty/test_tvterm.py out/pty/tvterm
            python3 tests/pty/test_vtrun.py out/pty/rundemo
            python3 tests/pty/test_clip.py out/pty/clipdemo
            python3 tests/pty/test_far2l.py out/pty/tvdemo out/pty/tvterm
        run: tools/ci-par.sh

  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The generated tables are what their generators make (Unicode 14.0 of Python 3.11)
        run: |
          python3 tools/gen-charsets.py > src/tvcharset.inc
          python3 tools/gen-codepage.py > src/tvcp.inc
          python3 tools/gen-width.py > src/tvwidth.inc
          git diff --exit-code src/tvcharset.inc src/tvcp.inc src/tvwidth.inc
